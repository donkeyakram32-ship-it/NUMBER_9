    <style>
      .quick-links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));

        margin-top: 20px;

      .quick-links a {
        display: block;

        border: 1px solid #d5d8e2;
        border-radius: 8px;
        padding: 24px;
        text-decoration: none;
        color: #25283d;
        font-weight: bold;
      }
      @media (max-width: 750px) {
        .quick-links {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
